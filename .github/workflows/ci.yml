name: Web CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:env
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run check:msw
      - run: npm run check:skills
      - run: npm run lint

  web-typecheck:
    name: web-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: PolyExam
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_MSW_ENABLED: 'false'
      - name: Ensure MSW and Faker are excluded from production
        run: |
          if grep -R -q -E "setupWorker|mockServiceWorker|@faker-js/faker|getPolyExamPublicAPIMock" .next/static .next/server; then
            echo "MSW or Faker leaked into the production build."
            exit 1
          fi
          echo "Production bundle excludes MSW and Faker."

  contract-lint:
    name: contract-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run contract:check
      - run: npm run contract:lint

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          NEXT_PUBLIC_MSW_ENABLED: 'true'
          PLAYWRIGHT_WEB_SERVER_COMMAND: 'npm run build && npm run start'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7

  ci-success:
    name: ci-success
    if: always()
    needs:
      - web-lint
      - web-typecheck
      - web-test
      - web-build
      - contract-lint
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "At least one CI job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All CI jobs passed."
